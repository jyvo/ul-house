[project]
name = "ul-house"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "customtkinter>=6.0.0",
    "lxml>=6.1.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
api = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]
build = [
    "boto3>=1.43.108",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "jsonschema>=4.26.0",
]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.3.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
addopts = "-ra -m 'not seed and not live and not dbt'"
markers = [
    "seed: full-seed runs, slow (deselected by default)",
    "live: contacts live wiki or deployed API (deselected by default)",
    "dbt: runs dbt builds on the mini seed (deselected by default, run with -m dbt)",
]
