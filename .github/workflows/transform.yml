name: transform
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build --group dev
      - name: Build tests
        run: >-
          uv run --locked --group build --group dev python -m pytest --no-fetch -p no:cacheprovider
          tests/test_load.py tests/test_gate.py tests/test_release.py tests/test_sign.py
          tests/test_publish.py tests/test_checkpoint.py tests/test_cli.py tests/test_object_store.py
      - name: dbt builds on the mini seed
        run: >-
          uv run --locked --group build --group dev python -m pytest --no-fetch -p no:cacheprovider
          -m dbt tests/test_dbt.py
