# lint
name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group api
      - name: Lint
        run: uvx ruff check src tests api
      - name: Types
        continue-on-error: true               # mypy is advisory
        run: uvx mypy src
      - name: Tests (no dbt, no seed)
        run: >-
          uv run --locked --group dev --group api python -m pytest --no-fetch -p no:cacheprovider
          --ignore=tests/test_load.py --ignore=tests/test_dbt.py --ignore=tests/test_gate.py
          --ignore=tests/test_release.py --ignore=tests/test_publish.py --ignore=tests/test_checkpoint.py
          --ignore=tests/test_cli.py --ignore=tests/test_seed.py --ignore=tests/test_object_store.py
