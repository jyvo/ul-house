# quarterly history checkpoint
name: checkpoint
on:
  schedule:
    - cron: "41 3 2 1,4,7,10 *"
  workflow_dispatch:
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
env:
  UL_HOUSE_STORE: r2
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ul-house
  BUILD: uv run --locked --group build python -m ul_house.build
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build
      - name: Checkpoint
        run: $BUILD checkpoint --work work
      - name: Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue create --title "Checkpoint failed" --body "The history in R2 is unchanged. $RUN_URL"
