# build scope, narrowable by settings

[cost]
min      = 42
max      = 98
cosmetic = 99

[rarity]
include = ["UR"]

[names]
excluded = ["awakening ninoyu"]
bypass   = ["xeno", "sopho"]            # kept regardless of filters

[evolution]
follow           = ["reforge", "awakening", "enlightening"]
direction        = "predecessors"       # only walk direction
depth            = 1                    # hops from kept item
policy           = "reference"          # exclude | reference | catalog
override_filters = true                 # bypass cost/rarity/name rules

[evolution.per_chain]                   # optional overrides
reforge      = { policy = "catalog" }   # track pre-reforge forms
enlightening = { depth = 2 }

[crawl]
request_interval         = 0.15         # hard throughput ceiling, sequential
max_retries              = 4
connect_timeout          = 5.0
read_timeout             = 15.0         # per socket read
request_deadline         = 30.0         # whole response deadline

[revalidate]                            # shards, never everything
cycle_days = 28                         # daily share of catalog
