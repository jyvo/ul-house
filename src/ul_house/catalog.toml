# build scope (ci crawl)
# settings may narrow it

[cost]
min      = 42
max      = 98
cosmetic = 99

[rarity]
include = ["UR"]

[names]
excluded = ["awakening ninoyu"]
bypass   = ["xeno", "sopho"]            # kept regardless of cost/rarity

[evolution]
follow           = ["reforge", "awakening", "enlightening"]
direction        = "predecessors"       # predecessors | successors | both
depth            = 1                    # hops from a kept item (0 disables)
policy           = "reference"          # exclude | reference | catalog
override_filters = true                 # bypass cost/rarity/name rules

[evolution.per_chain]                   # optional overrides
reforge      = { policy = "catalog" }   # pre-reforge SSR forms tracked
enlightening = { depth = 2 }

[crawl]
request_interval         = 0.15         # hard throughput ceiling: 1 / this; sequential (§3.9)
max_retries              = 4
connect_timeout          = 5.0
read_timeout             = 15.0         # per socket read
request_deadline         = 30.0         # entire response including worst case time

[revalidate]                            # shards, never entirety
cycle_days = 28                         # daily run revalidates 1/cycle_days of the catalog
